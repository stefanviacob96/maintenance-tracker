name: CI - Build and Test Personal Tracker

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start app and database
        run: IMAGE_TAG=ci docker compose up -d --build db app

      - name: Wait for app
        run: sleep 15

      - name: Test health endpoint
        run: curl --fail http://localhost:5000/health

      - name: Test assets endpoint
        run: curl --fail http://localhost:5000/assets

      - name: Test tasks endpoint
        run: curl --fail http://localhost:5000/tasks

      - name: Show container logs if failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v
