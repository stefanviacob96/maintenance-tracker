name: CI - Build and Test Personal Tracker

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t personal-maintenance-tracker .

      - name: Run container
        run: |
          docker run -d --name personal-tracker-test -p 5000:5000 personal-maintenance-tracker
          sleep 5

      - name: Test health endpoint
        run: curl --fail http://localhost:5000/health

      - name: Test assets endpoint
        run: curl --fail http://localhost:5000/assets

      - name: Test tasks endpoint
        run: curl --fail http://localhost:5000/tasks

      - name: Show container logs if failure
        if: failure()
        run: docker logs personal-tracker-test

      - name: Stop container
        if: always()
        run: docker stop personal-tracker-test

      - name: Remove container
        if: always()
        run: docker rm personal-tracker-test
