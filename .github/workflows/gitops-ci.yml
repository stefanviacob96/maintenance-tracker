name: GitOps CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      # BACKEND
      - name: Build backend image
        run: docker build -t iacobstev/maintenance-tracker-app:${TAG} .

      - name: Push backend image
        run: docker push iacobstev/maintenance-tracker-app:${TAG}

      # FRONTEND
      - name: Build frontend image
        run: docker build -t iacobstev/maintenance-tracker-frontend:${TAG} ./frontend

      - name: Push frontend image
        run: docker push iacobstev/maintenance-tracker-frontend:${TAG}

      # UPDATE HELM
      - name: Update Helm values
        run: |
          python - << 'PY'
          from pathlib import Path

          tag = "${{ env.TAG }}"
          path = Path("helm/personal-tracker/values.yaml")
          text = path.read_text()

          text = text.replace("tag: latest", f"tag: {tag}")
          text = text.replace("tag: v1", f"tag: {tag}")

          path.write_text(text)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/personal-tracker/values.yaml
          git commit -m "update images to ${TAG}" || echo "no changes"
          git push
