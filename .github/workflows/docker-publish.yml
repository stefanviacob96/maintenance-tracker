name: Build and Push Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t iacobstev/maintenance-tracker-app:${TAG} .

      - name: Push Docker image
        run: docker push iacobstev/maintenance-tracker-app:${TAG}

      - name: Update Helm image tags
        run: |
          python - << 'PY'
          from pathlib import Path

          path = Path("helm/personal-tracker/values.yaml")
          tag = "${{ env.TAG }}"
          text = path.read_text()

          text = text.replace("repository: iacobstev/maintenance-tracker-app\n  tag: latest",
                              f"repository: iacobstev/maintenance-tracker-app\n  tag: {tag}",
                              1)

          text = text.replace("repository: iacobstev/maintenance-tracker-app\n    tag: latest",
                              f"repository: iacobstev/maintenance-tracker-app\n    tag: {tag}")

          path.write_text(text)
          PY

      - name: Commit and push Helm tag update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/personal-tracker/values.yaml
          git commit -m "update backend image tag to ${TAG}" || echo "No changes to commit"
          git push
