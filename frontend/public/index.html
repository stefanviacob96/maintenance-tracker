<!DOCTYPE html>
<html>
<head>
    <title>Personal Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Personal Maintenance Tracker</h1>

    <h2>Assets</h2>
    <button onclick="loadAssets()">Load Assets</button>
    <ul id="assets-list"></ul>

    <h2>Tasks</h2>
    <button onclick="loadTasks()">Load Tasks</button>
    <ul id="tasks-list"></ul> 
   
    <h2>Create Task</h2>
    <input id="asset_id" placeholder="Asset ID">
    <input id="title" placeholder="Title">
    <input id="frequency" placeholder="Frequency days">
    <button onclick="createTask()">Create</button>

    <h2>Complete Task</h2>
    <input id="task_id" placeholder="Task ID">
    <input id="date" placeholder="YYYY-MM-DD">
    <button onclick="completeTask()">Complete</button>


    <script src="config.js"></script>
    <script src="app.js"></script>

    <h2>Run System Check</h2>

    <select id="script-select">
      <option value="memory_check">Memory</option>
      <option value="disk_check">Disk</option>
      <option value="cpu_check">CPU</option>
    </select>

   <button onclick="runCheck()">Run Check</button>

   <div id="job-result"></div>

    <h2>Job History</h2>
    <button onclick="loadJobHistory()">Refresh History</button>
    <div id="job-history"></div>

</body>
</html>
